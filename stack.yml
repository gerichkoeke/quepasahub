version: '3.8'

services:
  # PostgreSQL Database
  astrahub_db:
    image: postgres:16-alpine
    networks:
      - network_public
    volumes:
      - astrahub_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: astrahub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AstraHubDB2024SecurePass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Backend API
  astrahub_api:
    image: astraonline/astrahubback:0.0.1
    networks:
      - network_public
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:AstraHubDB2024SecurePass@astrahub_db:5432/astrahub?schema=public
      ADMIN_TOKEN: astrahub-admin-token-2024-secure-key

      # CORS
      CORS_ORIGIN: https://astrahub.seudominio.com.br

      # System Configuration
      SYSTEM_BASE_URL: https://astrahub.seudominio.com.br
      PUBLIC_URL: https://astrahub.seudominio.com.br

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Audio cache directory
      AUDIO_CACHE_DIR: /app/audio-cache
    volumes:
      - astrahub_audio_cache:/app/audio-cache
    depends_on:
      - astrahub_db
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"

        # HTTP Router
        - "traefik.http.routers.astrahub-api.rule=Host(`astrahub.seudominio.com.br`) && PathPrefix(`/api`)"
        - "traefik.http.routers.astrahub-api.entrypoints=websecure"
        - "traefik.http.routers.astrahub-api.tls=true"
        - "traefik.http.routers.astrahub-api.tls.certresolver=letsencryptresolver"

        # Middleware - Strip /api prefix
        - "traefik.http.middlewares.astrahub-api-strip.stripprefix.prefixes=/api"
        - "traefik.http.routers.astrahub-api.middlewares=astrahub-api-strip"

        # Service
        - "traefik.http.services.astrahub-api.loadbalancer.server.port=3000"
        - "traefik.http.services.astrahub-api.loadbalancer.sticky.cookie=true"
        - "traefik.http.services.astrahub-api.loadbalancer.healthcheck.path=/health"
        - "traefik.http.services.astrahub-api.loadbalancer.healthcheck.interval=30s"

        # Docker Swarm
        - "traefik.docker.network=network_public"

  # Frontend Web
  astrahub_web:
    image: astraonline/astrahubfront:0.0.1
    networks:
      - network_public
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"

        # HTTP Router
        - "traefik.http.routers.astrahub-web.rule=Host(`astrahub.seudominio.com.br`)"
        - "traefik.http.routers.astrahub-web.entrypoints=websecure"
        - "traefik.http.routers.astrahub-web.tls=true"
        - "traefik.http.routers.astrahub-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.astrahub-web.priority=1"

        # Service
        - "traefik.http.services.astrahub-web.loadbalancer.server.port=80"

        # Docker Swarm
        - "traefik.docker.network=network_public"

volumes:
  astrahub_db_data:
    external: true
    name: astrahub_db_data
  astrahub_audio_cache:
    external: true
    name: astrahub_audio_cache

networks:
  network_public:
    external: true
